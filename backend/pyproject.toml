[project]
name = "proplock-feature1"
version = "0.1.0"
description = "PropLock AI Feature 1: multimodal listing audit and commute-truth agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "langgraph==1.2.18",
    "groq==1.7.0",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "ImageHash==4.3.2",
    "PyYAML==6.0.3",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
