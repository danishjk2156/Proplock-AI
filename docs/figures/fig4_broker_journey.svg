<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .hd{font-size:10.5px;font-weight:700;letter-spacing:1px;fill:#8a8880}
      .t{font-size:13px;font-weight:600;fill:#2C2C2A}
      .s{font-size:11.5px;fill:#5F5E5A}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .c{font-size:11px;font-weight:600}
      .card{fill:#fff;stroke:#E2E0D8}
    </style>
  </defs>

  <text x="64" y="18" class="hd">STEP · WHAT FEATURE 1 ADDS</text>
  <text x="488" y="18" class="hd">SCAM STOPPED</text>
  <line x1="36" y1="52" x2="36" y2="522" stroke="#E2E0D8" stroke-width="3"/>

  <!-- row template: y0 = 30 + i*66 ; card 30..84 -->
  <!-- 0 -->
  <rect x="64" y="30" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="57" r="15" fill="#5F5E5A"/><text x="36" y="61.5" text-anchor="middle" class="n">0</text>
  <text x="80" y="52" class="t">Onboarding</text>
  <text x="80" y="71" class="s">Licence and ID on file · trust score starts at 100</text>
  <rect x="488" y="43" width="176" height="28" rx="14" fill="#F1EFE8"/><text x="576" y="61" text-anchor="middle" class="c" fill="#444441">Fake brokers (#9)</text>

  <!-- 1 -->
  <rect x="64" y="96" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="123" r="15" fill="#5F5E5A"/><text x="36" y="127.5" text-anchor="middle" class="n">1</text>
  <text x="80" y="118" class="t">Owner mandate</text>
  <text x="80" y="137" class="s">Manager assigns the flat with rent, deposit, brokerage limits</text>
  <rect x="488" y="109" width="176" height="28" rx="14" fill="#F1EFE8"/><text x="576" y="127" text-anchor="middle" class="c" fill="#444441">Bait (#2) · markup (#5)</text>

  <!-- 2 -->
  <rect x="64" y="162" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="189" r="15" fill="#534AB7"/><text x="36" y="193.5" text-anchor="middle" class="n">2</text>
  <text x="80" y="184" class="t">Site visit = capture</text>
  <text x="80" y="203" class="s">In-app photos with GPS; the broker is at the flat anyway</text>
  <rect x="488" y="175" width="176" height="28" rx="14" fill="#EEEDFE"/><text x="576" y="193" text-anchor="middle" class="c" fill="#3C3489">Fake photos (#1)</text>

  <!-- 3-4 -->
  <rect x="64" y="228" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="255" r="15" fill="#534AB7"/><text x="36" y="259.5" text-anchor="middle" class="n">3</text>
  <text x="80" y="250" class="t">Draft + instant pre-check</text>
  <text x="80" y="269" class="s">“Maps says 22 min, not 5” → one-click fixed wording</text>
  <rect x="488" y="241" width="176" height="28" rx="14" fill="#EEEDFE"/><text x="576" y="259" text-anchor="middle" class="c" fill="#3C3489">Commute, furnishing (#3 #4)</text>

  <!-- 5 -->
  <rect x="64" y="294" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="321" r="15" fill="#534AB7"/><text x="36" y="325.5" text-anchor="middle" class="n">4</text>
  <text x="80" y="316" class="t">Submit · full audit A–D</text>
  <text x="80" y="335" class="s">FAIL → NEEDS_FIX with evidence → edit and resubmit</text>
  <rect x="488" y="307" width="176" height="28" rx="14" fill="#EEEDFE"/><text x="576" y="325" text-anchor="middle" class="c" fill="#3C3489">All of the above</text>

  <!-- 6 -->
  <rect x="64" y="360" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="387" r="15" fill="#0F6E56"/><text x="36" y="391.5" text-anchor="middle" class="n">5</text>
  <text x="80" y="382" class="t">Publish</text>
  <text x="80" y="401" class="s">Signed share link, WhatsApp card, PayPal product</text>
  <rect x="488" y="373" width="176" height="28" rx="14" fill="#E1F5EE"/><text x="576" y="391" text-anchor="middle" class="c" fill="#085041">Edits after the badge</text>

  <!-- 7 -->
  <rect x="64" y="426" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="453" r="15" fill="#0F6E56"/><text x="36" y="457.5" text-anchor="middle" class="n">6</text>
  <text x="80" y="448" class="t">Keep fresh</text>
  <text x="80" y="467" class="s">Confirm every 7 days or EXPIRED · any edit = re-audit</text>
  <rect x="488" y="439" width="176" height="28" rx="14" fill="#E1F5EE"/><text x="576" y="457" text-anchor="middle" class="c" fill="#085041">Stale bait listings (#2)</text>

  <!-- 8 -->
  <rect x="64" y="492" width="410" height="54" rx="10" class="card"/>
  <circle cx="36" cy="519" r="15" fill="#0F6E56"/><text x="36" y="523.5" text-anchor="middle" class="n">7</text>
  <text x="80" y="514" class="t">Leads, visits, close</text>
  <text x="80" y="533" class="s">Hand-off to Features 2–4 · RENTED · trust score update</text>
  <rect x="488" y="505" width="176" height="28" rx="14" fill="#E1F5EE"/><text x="576" y="523" text-anchor="middle" class="c" fill="#085041">Double-booking (#11)</text>

  <!-- legend -->
  <circle cx="72" cy="568" r="6" fill="#5F5E5A"/><text x="84" y="572" class="s">setup</text>
  <circle cx="142" cy="568" r="6" fill="#534AB7"/><text x="154" y="572" class="s">verification</text>
  <circle cx="246" cy="568" r="6" fill="#0F6E56"/><text x="258" y="572" class="s">live listing</text>
  <text x="664" y="572" text-anchor="end" class="s">#n = scam number in section 7</text>
</svg>
