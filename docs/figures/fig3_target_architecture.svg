<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 884" width="680" height="884" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#73726c"/>
    </marker>
    <style>
      .ln{stroke:#73726c;stroke-width:1.4;fill:none}
      .band{fill:#FAFAF7;stroke:#E2E0D8}
      .bl{font-size:11px;font-weight:700;letter-spacing:1px;fill:#534AB7}
      .fx{font-size:10.5px;font-weight:600;fill:#8a8880}
      .t{font-size:13px;font-weight:600}
      .s{font-size:11px}
      .bt{font-size:10.5px;font-weight:700;fill:#fff}
    </style>
  </defs>

  <!-- ================= BAND 1 INTAKE ================= -->
  <rect x="4" y="4" width="672" height="184" rx="14" class="band"/>
  <text x="20" y="26" class="bl">1 · INTAKE</text>
  <text x="660" y="26" text-anchor="end" class="fx">fixes M6 · M8 · D7</text>

  <rect x="20" y="40" width="150" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="95" y="63" text-anchor="middle" class="t" fill="#2C2C2A">Manager</text>
  <text x="95" y="81" text-anchor="middle" class="s" fill="#5F5E5A">role: MANAGER</text>
  <line x1="170" y1="68" x2="344" y2="68" class="ln" marker-end="url(#a)"/>
  <text x="257" y="61" text-anchor="middle" class="s" fill="#5F5E5A">only role that writes</text>
  <rect x="348" y="40" width="310" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="503" y="63" text-anchor="middle" class="t" fill="#2C2C2A">Owner ground truth + mandate</text>
  <text x="503" y="81" text-anchor="middle" class="s" fill="#5F5E5A">verified GPS · baseline photos · rent range</text>

  <rect x="20" y="114" width="146" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="93" y="138" text-anchor="middle" class="t" fill="#2C2C2A">Broker</text>
  <text x="93" y="156" text-anchor="middle" class="s" fill="#5F5E5A">JWT login</text>
  <line x1="166" y1="143" x2="180" y2="143" class="ln" marker-end="url(#a)"/>
  <rect x="184" y="114" width="146" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="257" y="138" text-anchor="middle" class="t" fill="#2C2C2A">In-app capture</text>
  <text x="257" y="156" text-anchor="middle" class="s" fill="#5F5E5A">photo GPS + timestamp</text>
  <line x1="330" y1="143" x2="344" y2="143" class="ln" marker-end="url(#a)"/>
  <rect x="348" y="114" width="146" height="58" rx="10" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text x="421" y="138" text-anchor="middle" class="t" fill="#2C2C2A">Validate input</text>
  <text x="421" y="156" text-anchor="middle" class="s" fill="#5F5E5A">rent &gt; 0 · 1–20 images</text>
  <line x1="494" y1="143" x2="508" y2="143" class="ln" marker-end="url(#a)"/>
  <rect x="512" y="114" width="146" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="585" y="138" text-anchor="middle" class="t" fill="#3C3489">Claim extractor</text>
  <text x="585" y="156" text-anchor="middle" class="s" fill="#534AB7">reads title + description</text>
  <rect x="626" y="104" width="40" height="18" rx="9" fill="#A32D2D"/><text x="646" y="117" text-anchor="middle" class="bt">M2</text>


  <!-- ================= BAND 2 VERIFY ================= -->
  <rect x="4" y="204" width="672" height="244" rx="14" class="band"/>
  <text x="20" y="226" class="bl">2 · VERIFY — FOUR CHECKS IN PARALLEL</text>
  <text x="660" y="226" text-anchor="end" class="fx">fixes M1 · M3 · D1–D6 · D8</text>

  <rect x="214" y="234" width="250" height="34" rx="17" fill="#EEEDFE" stroke="#534AB7"/>
  <text x="339" y="256" text-anchor="middle" class="t" fill="#3C3489">LangGraph fan-out · timeout per check</text>
  <path d="M260 268 C260 280 93 278 93 290" class="ln" marker-end="url(#a)"/>
  <path d="M310 268 C310 280 257 278 257 290" class="ln" marker-end="url(#a)"/>
  <path d="M368 268 C368 280 421 278 421 290" class="ln" marker-end="url(#a)"/>
  <path d="M418 268 C418 280 585 278 585 290" class="ln" marker-end="url(#a)"/>

  <g>
    <rect x="20" y="294" width="146" height="140" rx="10" fill="#fff" stroke="#534AB7"/>
    <path d="M20 304 a10 10 0 0 1 10 -10 h126 a10 10 0 0 1 10 10 v20 h-146z" fill="#EEEDFE"/>
    <text x="93" y="314" text-anchor="middle" class="t" fill="#3C3489">A · Photos</text>
    <g class="s" fill="#2C2C2A">
      <text x="32" y="344">• taken within 100 m</text>
      <text x="32" y="361">• same room as baseline</text>
      <text x="32" y="378">• reverse image search</text>
      <text x="32" y="395">• dupes across flats</text>
      <text x="32" y="412">• watermark, furnishing</text>
    </g>
  </g>
  <g>
    <rect x="184" y="294" width="146" height="140" rx="10" fill="#fff" stroke="#534AB7"/>
    <path d="M184 304 a10 10 0 0 1 10 -10 h126 a10 10 0 0 1 10 10 v20 h-146z" fill="#EEEDFE"/>
    <text x="257" y="314" text-anchor="middle" class="t" fill="#3C3489">B · Commute</text>
    <g class="s" fill="#2C2C2A">
      <text x="196" y="344">• geocode in the city</text>
      <text x="196" y="361">• Routes API, traffic</text>
      <text x="196" y="378">• next weekday 08:30</text>
      <text x="196" y="395">• no data →</text>
      <text x="206" y="412" font-weight="600" fill="#854F0B">UNVERIFIABLE</text>
    </g>
  </g>
  <g>
    <rect x="348" y="294" width="146" height="140" rx="10" fill="#fff" stroke="#534AB7"/>
    <path d="M348 304 a10 10 0 0 1 10 -10 h126 a10 10 0 0 1 10 10 v20 h-146z" fill="#EEEDFE"/>
    <text x="421" y="314" text-anchor="middle" class="t" fill="#3C3489">C · Compliance</text>
    <g class="s" fill="#2C2C2A">
      <text x="360" y="344">• versioned rules file</text>
      <text x="360" y="361">• section + source URL</text>
      <text x="360" y="378">• effective date</text>
      <text x="360" y="395">• clause text shown</text>
      <text x="360" y="412">• law vs platform policy</text>
    </g>
  </g>
  <g>
    <rect x="512" y="294" width="146" height="140" rx="10" fill="#fff" stroke="#0F6E56" stroke-width="1.6"/>
    <path d="M512 304 a10 10 0 0 1 10 -10 h126 a10 10 0 0 1 10 10 v20 h-146z" fill="#E1F5EE"/>
    <text x="585" y="314" text-anchor="middle" class="t" fill="#085041">D · Ground truth</text>
    <g class="s" fill="#2C2C2A">
      <text x="524" y="344">• rent in owner range</text>
      <text x="524" y="361">• deposit ≤ owner’s</text>
      <text x="524" y="378">• furnishing matches</text>
      <text x="524" y="395">• brokerage declared</text>
      <text x="524" y="412">• no AI, no API needed</text>
    </g>
    <rect x="618" y="284" width="46" height="18" rx="9" fill="#0F6E56"/><text x="641" y="297" text-anchor="middle" class="bt">NEW</text>
  </g>


  <!-- ================= BAND 3 DECIDE ================= -->
  <rect x="4" y="464" width="672" height="152" rx="14" class="band"/>
  <text x="20" y="486" class="bl">3 · DECIDE</text>
  <text x="660" y="486" text-anchor="end" class="fx">replaces VERIFIED / REJECTED only</text>

  <rect x="214" y="486" width="250" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="339" y="508" text-anchor="middle" class="t" fill="#085041">Decision engine</text>
  <text x="339" y="526" text-anchor="middle" class="s" fill="#0F6E56">PASS · FAIL · UNVERIFIABLE per check</text>

  <path d="M250 538 C250 548 120 546 120 554" class="ln" marker-end="url(#a)"/>
  <line x1="339" y1="538" x2="339" y2="554" class="ln" marker-end="url(#a)"/>
  <path d="M428 538 C428 548 560 546 560 554" class="ln" marker-end="url(#a)"/>

  <rect x="30" y="558" width="180" height="32" rx="16" fill="#FAECE7" stroke="#993C1D"/>
  <text x="120" y="579" text-anchor="middle" class="t" fill="#712B13">any FAIL → NEEDS_FIX</text>
  <text x="120" y="606" text-anchor="middle" class="s" fill="#5F5E5A">evidence + suggested fix</text>
  <rect x="249" y="558" width="180" height="32" rx="16" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="339" y="579" text-anchor="middle" class="t" fill="#633806">unsure → IN_REVIEW</text>
  <text x="339" y="606" text-anchor="middle" class="s" fill="#5F5E5A">manager approves → step 4</text>
  <rect x="470" y="558" width="180" height="32" rx="16" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="560" y="579" text-anchor="middle" class="t" fill="#085041">all PASS → seal</text>


  <!-- ================= BAND 4 SEAL ================= -->
  <rect x="4" y="632" width="672" height="120" rx="14" class="band"/>
  <text x="20" y="654" class="bl">4 · SEAL AND MINT</text>
  <text x="440" y="654" text-anchor="end" class="fx">fixes M4 · M5 · M7</text>

  <rect x="20" y="668" width="146" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="93" y="692" text-anchor="middle" class="t" fill="#085041">Sign</text>
  <text x="93" y="710" text-anchor="middle" class="s" fill="#0F6E56">everything checked</text>
  <text x="93" y="726" text-anchor="middle" class="s" fill="#0F6E56">HMAC + server secret</text>
  <line x1="166" y1="703" x2="180" y2="703" class="ln" marker-end="url(#a)"/>
  <rect x="184" y="668" width="146" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="257" y="692" text-anchor="middle" class="t" fill="#085041">Save first</text>
  <text x="257" y="710" text-anchor="middle" class="s" fill="#0F6E56">one transaction</text>
  <text x="257" y="726" text-anchor="middle" class="s" fill="#0F6E56">status PENDING_MINT</text>
  <line x1="330" y1="703" x2="344" y2="703" class="ln" marker-end="url(#a)"/>
  <rect x="348" y="668" width="146" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="421" y="692" text-anchor="middle" class="t" fill="#085041">Outbox worker</text>
  <text x="421" y="710" text-anchor="middle" class="s" fill="#0F6E56">id = PL-submission_id</text>
  <text x="421" y="726" text-anchor="middle" class="s" fill="#0F6E56">safe retries</text>
  <line x1="494" y1="703" x2="508" y2="703" class="ln" marker-end="url(#a)"/>
  <rect x="512" y="668" width="146" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="585" y="692" text-anchor="middle" class="t" fill="#085041">PayPal product</text>
  <text x="585" y="710" text-anchor="middle" class="s" fill="#0F6E56">description ≤ 256</text>
  <text x="585" y="726" text-anchor="middle" class="s" fill="#0F6E56">real product id</text>


  <!-- ================= BAND 5 PUBLISH ================= -->
  <rect x="4" y="768" width="672" height="112" rx="14" class="band"/>
  <text x="20" y="790" class="bl">5 · PUBLISH</text>
  <text x="440" y="790" text-anchor="end" class="fx">fixes D9</text>

  <rect x="20" y="804" width="200" height="62" rx="10" fill="#fff" stroke="#0F6E56"/>
  <text x="120" y="828" text-anchor="middle" class="t" fill="#085041">GET /audit/{id}/verify</text>
  <text x="120" y="846" text-anchor="middle" class="s" fill="#5F5E5A">recompute signature;</text>
  <text x="120" y="860" text-anchor="middle" class="s" fill="#993C1D">mismatch → NEEDS_FIX</text>
  <line x1="236" y1="835" x2="224" y2="835" class="ln" marker-end="url(#a)"/>
  <rect x="240" y="804" width="200" height="62" rx="10" fill="#fff" stroke="#0F6E56"/>
  <text x="340" y="828" text-anchor="middle" class="t" fill="#085041">Public listing page</text>
  <text x="340" y="846" text-anchor="middle" class="s" fill="#5F5E5A">owner’s photos ·</text>
  <text x="340" y="860" text-anchor="middle" class="s" fill="#5F5E5A">this submission’s audit only</text>
  <line x1="472" y1="835" x2="444" y2="835" class="ln" marker-end="url(#a)"/>
  <rect x="476" y="804" width="182" height="62" rx="10" fill="#0F6E56" stroke="#0F6E56"/>
  <text x="567" y="830" text-anchor="middle" class="t" fill="#fff">VERIFIED · LIVE</text>
  <text x="567" y="850" text-anchor="middle" class="s" fill="#E1F5EE">badge + share link</text>
  <!-- connectors between bands (drawn last so bands do not cover them) -->
  <line x1="339" y1="176" x2="339" y2="230" class="ln" marker-end="url(#a)"/>
  <line x1="339" y1="434" x2="339" y2="482" class="ln" marker-end="url(#a)"/>
  <path d="M560 590 L560 618 Q560 624 554 624 L164 624 Q158 624 158 630 L158 664" class="ln" marker-end="url(#a)"/>
  <line x1="585" y1="738" x2="585" y2="790" class="ln" marker-end="url(#a)"/>
</svg>
